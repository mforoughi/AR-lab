<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Print tracking sheet</title><style>body{margin:0;background:#edf0e9;font:14px system-ui;text-align:center;color:#183c35}header{padding:20px}button{padding:10px 20px;background:#183c35;color:white;border:0;border-radius:6px;cursor:pointer}img{display:block;width:min(95vw,720px);margin:0 auto 25px}#error{padding:30px}@page{size:A4 portrait;margin:10mm}@media print{body{background:white}header{display:none}img{width:190mm;height:253.333mm;margin:0;object-fit:contain}}</style></head><body><header><h2>Project tracking sheet</h2><p>Print the whole sheet without cropping. Keep it flat and evenly lit.</p><button onclick="print()">Print sheet</button></header><img id="sheet" alt="Project tracking sheet"><p id="error"></p><script type="module">import{getProject,asset}from'./common.js';const id=new URLSearchParams(location.search).get('id');try{await getProject(id,{draft:new URLSearchParams(location.search).has('edit')});document.querySelector('#sheet').src=asset(id,'sheet');document.querySelector('#sheet').onerror=()=>document.querySelector('#error').textContent='Generate the tracking sheet in the dashboard first.';}catch(e){document.querySelector('#error').textContent=e.message;}</script></body></html>
