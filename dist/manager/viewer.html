:10px}#controls{padding:10px;gap:7px}#controls button,#controls select{font-size:11px;padding:9px}}[hidden]{display:none!important}</style></head><body><header><div><small>CONSTRUCTION AR LAB</small><strong id="title">Loading project…</strong></div><div><button id="preview" disabled>3D</button> <button id="ar" disabled>Start AR</button> <a id="sheetLink" target="_blank">Print sheet ↗</a></div></header><div id="stage"><div id="scene"></div><div id="scheduleNotice" role="status" hidden></div><div id="message" role="status" aria-live="polite">Starting viewer…</div></div><div id="controls"><button id="play" disabled>▶</button><input id="timeline" disabled type="range" min="0" max="1" step=".01" value="1" aria-label="Schedule timeline"><span id="task">Complete model</span><select id="speed" disabled aria-label="Playback speed"><option value="1">1× · 25s</option><option value="2">2×</option><option value="4">4×</option></select><button id="complete" disabled>Complete</button></div><script>
